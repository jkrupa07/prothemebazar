<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Home</title>
    <!-- Favicons -->
    <link rel="icon" href="assets/images/favicon.svg" sizes="32x32" type="image/png" />
    <!-- Bootstrap core CSS -->
    <link href="assets/css/main.css" rel="stylesheet" />

</head>

<body>
    <div class="dpt-200"></div>

    <section class="contact-us-section">
        <div class="container">
            <div class="row">
                <div class="col-lg-6 map-content">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3719.5488759127193!2d72.84707287564754!3d21.21007268048508!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be04f2fd3e0c681%3A0x6e91a2940224bd39!2sCodexive%20Solutions!5e0!3m2!1sen!2sin!4v1777543698110!5m2!1sen!2sin"
                        width="600" height="450" style="border:0;" allowfullscreen="" class="h-100 w-100" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
                <div class="col-lg-6">
                    <div class="col-lg-9 mx-auto">
                        <div class="rubik-bold font46 leading50 text-center dpb-20">
                            Get in touch
                        </div>
                        <div class="rubik-semibold font16 leading20 text-center text-808080 dpb-35">
                            Nemo enim ipsam voluptatem quia voluptas
                        </div>
                    </div>
                    <div class="col-lg-9 mx-auto">
                        <form action="">
                            <div class="row row12 dmb-10">
                                <div class="col-12 dmb-20">
                                    <input type="text"
                                        class="input bg-white w-100 rubik-medium font16 leading20  px-3  rounded-pill"
                                        placeholder="Your name" />
                                </div>
                                <div class="col-12 dmb-20">
                                    <input type="text"
                                        class="input bg-white w-100 rubik-medium  font16 leading20  px-3  rounded-pill"
                                        placeholder="Email" />
                                </div>
                                <div class="col-12 dmb-20">
                                    <input type="text"
                                        class="input bg-white w-100 rubik-medium  font16 leading20  px-3  rounded-pill"
                                        placeholder="Subject" />
                                </div>
                                <div class="col-12 dmb-20">
                                    <textarea name="" id=""
                                        class="textarea bg-white w-100 rubik-medium  font16 leading20 p-3 radius24"
                                        placeholder="Your Message"></textarea>
                                </div>
                            </div>
                        </form>
                        <div class="">
                            <a href=""
                                class="btnA gradiant-btn rubik d-inline-flex align-items-center rounded-pill fw-medium font18 leading20 text-decoration-none transition ms-2">
                                Send Message</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <div class="dpt-130"></div>

    <section class="contact-card-section bg-fafafa dpt-110 dpb-110">
        <div class="container">
            <div class="row row10">
                <div class="col-lg-4 contact-cards">
                    <div class="bg-white overflow-hidden radius16 text-center dpt-50 dpb-50">
                        <div class="d-flex flex-column align-items-center justify-content-center">
                            <div class="contact-icon rounded-pill d-flex justify-content-center align-items-center">
                                <div class="contact-img d-inline-flex align-items-center justify-content-center">
                                    <img src="assets/images/icon/location.svg" class="h-100" alt="" />
                                </div>
                            </div>
                            <div class="rubik-semibold font20 leading28 text-black dpt-25">
                                Email Address
                            </div>
                            <div class="rubik font16 leading26 text-black dpt-15">
                                info@example.com <br>
                                moreinfo@email.com
                            </div>

                        </div>
                    </div>
                </div>

                <div class="col-lg-4 contact-cards">
                    <div class="bg-white overflow-hidden radius16 text-center dpt-50 dpb-50">
                        <div class="d-flex flex-column align-items-center justify-content-center">
                            <div class="contact-icon rounded-pill d-flex justify-content-center align-items-center">
                                <div class="contact-img d-inline-flex align-items-center justify-content-center">
                                    <img src="assets/images/icon/email.svg" class="h-100" alt="" />
                                </div>
                            </div>
                            <div class="rubik-semibold font20 leading28 text-black dpt-25">
                                Phone Number
                            </div>
                            <div class="rubik  font16 leading26 text-black dpt-15">
                                +44 569 985 9665<br>
                                +56 455 741 6982
                            </div>

                        </div>

                    </div>
                </div>

                <div class="col-lg-4 contact-cards">
                    <div class="bg-white overflow-hidden radius16 text-center dpt-50 dpb-50">
                        <div class="d-flex flex-column align-items-center justify-content-center">
                            <div class="contact-icon rounded-pill d-flex justify-content-center align-items-center">
                                <div class="contact-img d-inline-flex align-items-center justify-content-center">
                                    <img src="assets/images/icon/phone.svg" class="h-100" alt="" />
                                </div>
                            </div>
                            <div class="rubik-semibold font20 leading28 text-black dpt-25">
                                Office Location
                            </div>
                            <div class="rubik  font16 leading26 text-black dpt-15">
                                202 New Hampshire Avenue, Northwest
                                <br>
                                #100, New York-2573
                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>

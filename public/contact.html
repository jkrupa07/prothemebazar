<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Home</title>
    <!-- Favicons -->
    <link rel="icon" href="assets/images/favicon.svg" sizes="32x32" type="image/png" />
    <!-- Bootstrap core CSS -->
    <link href="assets/css/main.css" rel="stylesheet" />

</head>

<body>
    <div class="dpt-200"></div>

    <section class="left-right-section">
        <div class="container">
            <div class="row">
                <div class="col-lg-6">

                </div>
                <div class="col-lg-6">
                    <div class="col-lg-10 mx-auto">
                        <div class="rubik-bold font46 leading50 text-center">
                            Get in touch
                        </div>
                        <div class="">
                            Nemo enim ipsam voluptatem quia voluptas
                        </div>
                    </div>
                    <form action="">
                        <div class="row row12 dmb-25">
                            <div class="col-12 dmb-10">
                                <div class="sora-bold font14 leading20 text-2E3038 dmb-10">Full Name </div>
                                <input type="text"
                                    class="input bg-white w-100 sora-regular font14 leading20 text-9CA3AF px-3 radius8"
                                    placeholder="John Doe" />
                            </div>
                            <div class="col-12 dmb-10">
                                <div class="sora-bold font14 leading20 text-2E3038 dmb-10">Email Address </div>
                                <input type="text"
                                    class="input bg-white w-100 sora-regular font14 leading20 text-9CA3AF px-3 radius8"
                                    placeholder="john@example.com" />
                            </div>
                            <div class="col-12 dmb-10">
                                <div class="sora-bold font14 leading20 text-2E3038 dmb-10">Phone Number </div>
                                <input type="text"
                                    class="input bg-white w-100 sora-regular font14 leading20 text-9CA3AF px-3 radius8"
                                    placeholder="+44 7000 000000" />
                            </div>
                            <div class="col-12 dmb-10">
                                <div class="sora-bold font14 leading20 text-2E3038 dmb-10">Enquiry Type </div>
                                <input type="text"
                                    class="input bg-white w-100 sora-regular font14 leading20 text-9CA3AF px-3 radius8"
                                    placeholder="General Enquiry" />
                            </div>
                            <div class="col-12 dmb-10">
                                <div class="sora-bold font14 leading20 text-2E3038 dmb-10">Message </div>
                                <textarea type="text"
                                    class="textarea bg-white w-100 sora-regular font14 leading20 text-9CA3AF px-3 radius8"
                                    placeholder="How can we help you?">
                          </textarea>
                            </div>
                        </div>
                    </form>
                    <div class="">
                        <a href=""
                            class="text-decoration-none btnA bg-BA9EDE-btn sora-normal font14 leading16 d-inline-flex justify-content-center align-items-center rounded-pill">
                            Send Message</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="contact-card-section bg-fafafa dpt-110 dpb-110">
        <div class="container">
            <div class="row row10">
                <div class="col-lg-4 contact-cards">
                    <div class="bg-white overflow-hidden radius16 text-center dpt-50 dpb-50">
                        <div class="d-flex flex-column align-items-center justify-content-center">
                            <div class="contact-icon rounded-pill d-flex justify-content-center align-items-center">
                                <div class="contact-img d-inline-flex align-items-center justify-content-center">
                                    <img src="assets/images/icon/email.svg" class="h-100" alt="" />
                                </div>
                            </div>
                            <div class="rubik-regular fw-semibold font20 leading28 text-black dpt-25">
                                Email Address
                            </div>
                            <div class="rubik-regular fw-normal font16 leading26 text-black dpt-15">
                                info@example.com <br>
                                moreinfo@email.com
                            </div>

                        </div>

                    </div>
                </div>

                <div class="col-lg-4 contact-cards">
                    <div class="bg-white overflow-hidden radius16 text-center dpt-50 dpb-50">
                        <div class="d-flex flex-column align-items-center justify-content-center">
                            <div class="contact-icon rounded-pill d-flex justify-content-center align-items-center">
                                <div class="contact-img d-inline-flex align-items-center justify-content-center">
                                    <img src="assets/images/icon/phone.svg" class="h-100" alt="" />
                                </div>
                            </div>
                            <div class="rubik-regular fw-semibold font20 leading28 text-black dpt-25">
                                Email Address
                            </div>
                            <div class="rubik-regular fw-normal font16 leading26 text-black dpt-15">
                                info@example.com <br>
                                moreinfo@email.com
                            </div>

                        </div>

                    </div>
                </div>

                <div class="col-lg-4 contact-cards">
                    <div class="bg-white overflow-hidden radius16 text-center dpt-50 dpb-50">
                        <div class="d-flex flex-column align-items-center justify-content-center">
                            <div class="contact-icon rounded-pill d-flex justify-content-center align-items-center">
                                <div class="contact-img d-inline-flex align-items-center justify-content-center">
                                    <img src="assets/images/icon/location.svg" class="h-100" alt="" />
                                </div>
                            </div>
                            <div class="rubik-regular fw-semibold font20 leading28 text-black dpt-25">
                                Email Address
                            </div>
                            <div class="rubik-regular fw-normal font16 leading26 text-black dpt-15">
                                info@example.com <br>
                                moreinfo@email.com
                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
